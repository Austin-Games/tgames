<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hebdar Tutoring | Web Proxy</title>
  <style>
    :root { color-scheme: dark; --accent:#f2ab34; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:#090b10; color:#f5f5f5; }
    header { padding:22px; text-align:center; border-bottom:1px solid #252a35; }
    h1 { margin:0 0 6px; color:var(--accent); }
    .subtitle { color:#aeb5c2; }
    main { max-width:1100px; margin:auto; padding:22px; }
    form { display:flex; gap:10px; }
    input { flex:1; padding:13px 15px; border:1px solid #3a4150; border-radius:10px; background:#121722; color:white; font-size:16px; }
    button { padding:13px 18px; border:0; border-radius:10px; background:var(--accent); color:#111; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    #status { margin:14px 0; color:#aeb5c2; min-height:24px; }
    #viewer { min-height:65vh; padding:22px; border:1px solid #252a35; border-radius:14px; background:#fff; color:#111; overflow:auto; }
    #viewer img { max-width:100%; height:auto; }
    #viewer a { color:#0757a5; }
    .notice { margin-top:14px; color:#858d9b; font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>Hebdar Tutoring</h1>
    <div class="subtitle">Safe Web Proxy / Reader</div>
  </header>
  <main>
    <form id="proxyForm">
      <input id="url" type="url" placeholder="https://example.com" autocomplete="off" required>
      <button id="go" type="submit">Open</button>
    </form>
    <div id="status">Enter a website URL to begin.</div>
    <section id="viewer" aria-live="polite"></section>
    <div class="notice">This reader removes scripts, forms, frames, and unsafe links before displaying fetched pages.</div>
  </main>

  <!-- jsDelivr serves the JavaScript from this GitHub repository. -->
  <script src="https://cdn.jsdelivr.net/gh/Austin-Games/tgames@main/proxy.js"></script>
</body>
</html>
